services:
  assets:
    image: node:22-alpine
    container_name: mototrax_assets
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      # npm heeft een schrijfbare HOME nodig; de bind mount is van de host-user,
      # dus de cache mag niet in een root-owned /root belanden.
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    volumes:
      - ./:/app
    command: sh -c "npm ci --no-audit --no-fund && npm run build"

  app:
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mototrax_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    env_file:
      - .env
    environment:
      # Deze stack draait altijd tegen de meegeleverde postgres-service. Die
      # waarden staan hier en niet in .env.example, zodat de demo zonder
      # handmatige env-stap werkt en .env.example bruikbaar blijft voor een
      # lokale sqlite-opzet. `environment` wint van `env_file`, dus een
      # afwijkende DB_CONNECTION in .env breekt de stack niet meer.
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: mototrax
      DB_USERNAME: mototrax_user
      DB_PASSWORD: mototrax_password
    networks:
      - mototrax_network
    depends_on:
      db:
        condition: service_healthy
      assets:
        condition: service_completed_successfully

  db:
    image: postgres:15
    container_name: mototrax_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mototrax
      POSTGRES_USER: mototrax_user
      POSTGRES_PASSWORD: mototrax_password
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - mototrax_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mototrax_user -d mototrax"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: mototrax_nginx
    restart: unless-stopped
    # Port mapping handled in override files to avoid conflicts
    # Use docker-compose.local.yml for custom port configuration
    volumes:
      - ./:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - mototrax_network
    depends_on:
      app:
        condition: service_started
      assets:
        condition: service_completed_successfully

networks:
  mototrax_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
