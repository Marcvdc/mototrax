name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, xml, zip, pcntl, bcmath, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Check code style (Pint, informational)
        # De bestaande codebase is nog niet volledig Pint-clean; deze stap maakt
        # style-drift zichtbaar zonder de build te blokkeren. Zie de follow-up in issue #8.
        continue-on-error: true
        run: ./vendor/bin/pint --test
